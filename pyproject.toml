[project]
name = "shfa-schedule-bot"
version = "0.1.0"
description = "Discord bot for SHFA instructor coverage and Gymdesk schedule monitoring."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.5.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
shfa-schedule-bot = "shfa_schedule_bot.bot:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
